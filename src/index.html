<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERENDIPPO · Atlas Décolonial</title>
<meta name="description" content="Visualiseur cartographique à projections alternatives — décoloniser le regard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="brand">
  <h1>ATLAS<span class="accent">·</span>DÉCOLONIAL</h1>
  <p class="tagline">déplier le monde // changer de regard</p>
</header>

<svg id="map" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="Carte du monde interactive"></svg>

<!-- Panneau latéral droit -->
<nav class="toolbar" aria-label="Contrôles carte">
  <div class="tool-group">
    <label class="tool-label" for="proj-select">Projection</label>
    <select id="proj-select" class="tool-select">
      <option value="equalEarth">Equal Earth</option>
      <option value="hoboDyer">Hobo-Dyer (37,5°)</option>
      <option value="gallPeters">Gall-Peters (45°)</option>
      <option value="equirectangular">Équirectangulaire</option>
      <option value="authaGraph">AuthaGraph* (Imago)</option>
    </select>
  </div>

  <button id="btn-southup" class="tool-btn" title="Inverser : Sud en haut" aria-pressed="false">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="8" cy="8" r="6.2"/><path d="M8 1.8v12.4M5.2 4.6l2.8-2.8 2.8 2.8"/>
    </svg><span>Sud ↑</span>
  </button>

  <button id="btn-graticule" class="tool-btn active" title="Graticule" aria-pressed="true">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
      <circle cx="8" cy="8" r="6.2"/><ellipse cx="8" cy="8" rx="2.8" ry="6.2"/><path d="M1.8 8h12.4"/>
    </svg><span>Graticule</span>
  </button>

  <button id="btn-export" class="tool-btn" title="Exporter en SVG vectoriel">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M8 2v8m0 0l-3-3m3 3l3-3M3 13h10"/>
    </svg><span>Export SVG</span>
  </button>
</nav>

<!-- Barre de morphing basse -->
<div class="morphbar">
  <span class="morph-label">GLOBE</span>
  <input id="morph-slider" type="range" min="0" max="100" value="0" step="0.5"
         aria-label="Interpolation globe vers projection">
  <span class="morph-label">CARTE</span>
  <button id="btn-play" class="play-btn" title="Animer la transition">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><path d="M3 1.5l9 5.5-9 5.5z"/></svg>
  </button>
</div>

<footer class="credit">
  <span>*Imago ≈ AuthaGraph (k=0.68) — données Natural Earth / world-atlas (domaine public) — d3-geo · d3-geo-projection · d3-geo-polygon (ISC)</span>
</footer>

<script src="lib/d3.v7.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="lib/d3-geo-projection.min.js"></script>
<script src="lib/d3-geo-polygon.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
